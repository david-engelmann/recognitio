<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470" role="img" aria-labelledby="storyTitle storyDesc">
  <title id="storyTitle">The failure to packet story. A hosted diff drops content in silence, and a packet built from the local clone must account for every file in the range or fail.</title>
  <desc id="storyDesc">Two panels on a dark ground the graphic carries itself. The hosted diff panel lists the silent losses this page records. The local packet panel lists what building from the clone proves instead.</desc>
  <rect width="880" height="470" fill="#13151B"/>
  <rect x="1" y="1" width="878" height="468" fill="none" stroke="#343842" stroke-width="2"/>

  <text x="44" y="54" font-family="sans-serif" font-size="24" font-weight="700" fill="#E4E7EC">From a silent summary to a counted packet</text>
  <text x="44" y="80" font-family="sans-serif" font-size="14" fill="#B0B6C0">The failure behind the first principle on this page, in one frame</text>

  <rect x="44" y="104" width="368" height="240" rx="14" fill="#181B23" stroke="#343842" stroke-width="2"/>
  <text x="68" y="144" font-family="sans-serif" font-size="17" font-weight="700" fill="#B0B6C0">The hosted diff</text>
  <g stroke="#D97757" stroke-width="3" stroke-linecap="round">
    <line x1="70" y1="170" x2="82" y2="182"/>
    <line x1="82" y1="170" x2="70" y2="182"/>
    <line x1="70" y1="206" x2="82" y2="218"/>
    <line x1="82" y1="206" x2="70" y2="218"/>
    <line x1="70" y1="242" x2="82" y2="254"/>
    <line x1="82" y1="242" x2="70" y2="254"/>
    <line x1="70" y1="278" x2="82" y2="290"/>
    <line x1="82" y1="278" x2="70" y2="290"/>
  </g>
  <g font-family="sans-serif" font-size="15" fill="#E4E7EC">
    <text x="96" y="181">File counts capped by the service</text>
    <text x="96" y="217">Oversized patches dropped whole</text>
    <text x="96" y="253">No flag on either loss</text>
    <text x="96" y="289">Success reported over the top</text>
  </g>
  <text x="68" y="326" font-family="sans-serif" font-size="13" fill="#B0B6C0">Each silence passes downstream unseen</text>

  <g stroke="#D97757" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="424" y1="224" x2="448" y2="224"/>
    <polyline points="438,214 450,224 438,234"/>
  </g>

  <rect x="468" y="104" width="368" height="240" rx="14" fill="#181B23" stroke="#343842" stroke-width="2"/>
  <text x="492" y="144" font-family="sans-serif" font-size="17" font-weight="700" fill="#E4E7EC">The packet from the local clone</text>
  <g stroke="#4AC76A" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="494,174 500,181 508,168"/>
    <polyline points="494,210 500,217 508,204"/>
    <polyline points="494,246 500,253 508,240"/>
    <polyline points="494,282 500,289 508,276"/>
  </g>
  <g font-family="sans-serif" font-size="15" fill="#E4E7EC">
    <text x="520" y="181">Extraction reads git objects on disk</text>
    <text x="520" y="217">The packet lists the whole range</text>
    <text x="520" y="253">An unaccounted file fails the run</text>
    <text x="520" y="289">Nothing passes unnoticed</text>
  </g>
  <text x="492" y="326" font-family="sans-serif" font-size="13" fill="#B0B6C0">The packet list is the range list</text>

  <text x="44" y="392" font-family="sans-serif" font-size="15" font-weight="600" fill="#E4E7EC">No check downstream can restore a file the source never mentioned.</text>
  <text x="44" y="438" font-family="sans-serif" font-size="12" fill="#B0B6C0">Source. The failure record stated in the first section of this page.</text>
</svg>
