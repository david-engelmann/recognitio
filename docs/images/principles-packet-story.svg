<svg xmlns="http://www.w3.org/2000/svg" width="880" height="934" viewBox="0 0 880 934" role="img" aria-labelledby="storyTitle storyDesc">
  <title id="storyTitle">The failure to packet story. A hosted diff drops content in silence, and a packet built from the local clone must account for every file in the range or fail.</title>
  <desc id="storyDesc">Two panels on a dark ground the graphic carries itself. The hosted diff panel lists the silent losses this page records. The local packet panel lists what building from the clone proves instead.</desc>
  <rect width="880" height="934" fill="#13151B"/>
  <rect x="1" y="1" width="878" height="932" fill="none" stroke="#343842" stroke-width="2"/>

  <text x="44" y="58" font-family="sans-serif" font-size="34" font-weight="700" fill="#E4E7EC">From a silent summary to a counted packet</text>
  <text x="44" y="94" font-family="sans-serif" font-size="23" fill="#B0B6C0">The failure behind the first principle on this page, in one frame</text>

  <rect x="44" y="118" width="792" height="296" rx="14" fill="#181B23" stroke="#343842" stroke-width="2"/>
  <text x="68" y="162" font-family="sans-serif" font-size="23" font-weight="700" fill="#B0B6C0">The hosted diff</text>
  <g stroke="#D97757" stroke-width="3" stroke-linecap="round">
    <line x1="70" y1="188" x2="84" y2="202"/>
    <line x1="84" y1="188" x2="70" y2="202"/>
    <line x1="70" y1="232" x2="84" y2="246"/>
    <line x1="84" y1="232" x2="70" y2="246"/>
    <line x1="70" y1="276" x2="84" y2="290"/>
    <line x1="84" y1="276" x2="70" y2="290"/>
    <line x1="70" y1="320" x2="84" y2="334"/>
    <line x1="84" y1="320" x2="70" y2="334"/>
  </g>
  <g font-family="sans-serif" font-size="23" fill="#E4E7EC">
    <text x="102" y="203">File counts capped by the service</text>
    <text x="102" y="247">Oversized patches dropped whole</text>
    <text x="102" y="291">No flag on either loss</text>
    <text x="102" y="335">Success reported over the top</text>
  </g>
  <text x="68" y="382" font-family="sans-serif" font-size="23" fill="#B0B6C0">Each silence passes downstream unseen</text>

  <g stroke="#D97757" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="440" y1="426" x2="440" y2="452"/>
    <polyline points="430,442 440,454 450,442"/>
  </g>

  <rect x="44" y="466" width="792" height="296" rx="14" fill="#181B23" stroke="#343842" stroke-width="2"/>
  <text x="68" y="510" font-family="sans-serif" font-size="23" font-weight="700" fill="#E4E7EC">The packet from the local clone</text>
  <g stroke="#4AC76A" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="70,544 77,552 88,538"/>
    <polyline points="70,588 77,596 88,582"/>
    <polyline points="70,632 77,640 88,626"/>
    <polyline points="70,676 77,684 88,670"/>
  </g>
  <g font-family="sans-serif" font-size="23" fill="#E4E7EC">
    <text x="102" y="551">Extraction reads git objects on disk</text>
    <text x="102" y="595">The packet lists the whole range</text>
    <text x="102" y="639">An unaccounted file fails the run</text>
    <text x="102" y="683">Nothing passes unnoticed</text>
  </g>
  <text x="68" y="730" font-family="sans-serif" font-size="23" fill="#B0B6C0">The packet list is the range list</text>

  <text x="44" y="812" font-family="sans-serif" font-size="23" font-weight="600" fill="#E4E7EC">No check downstream can restore a file the source never mentioned.</text>
  <text x="44" y="884" font-family="sans-serif" font-size="23" fill="#B0B6C0">Source. The failure record stated in the first section of this page.</text>
</svg>
