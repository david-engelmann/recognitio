<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="hlTitle hlDesc">
  <title id="hlTitle">Recognitio 1.3.0 highlights. The packet pass found 8 of 8 planted defects against 4 of 8 for the raw diff pass, and one recorded run covered 28 files and 3,233 lines.</title>
  <desc id="hlDesc">A dark card carrying its own ground. It holds the brand icon, the paired eval bars, the recorded run figures and the limit that a verified packet proves completeness and nothing more.</desc>
  <rect width="1200" height="630" fill="#13151B"/>
  <rect x="1" y="1" width="1198" height="628" fill="none" stroke="#343842" stroke-width="2"/>

  <g transform="translate(64 52)">
    <rect x="0" y="0" width="100" height="100" rx="26" fill="#D97757"/>
    <polyline points="24,50 44,71 76,29" fill="none" stroke="#13151B" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="196" y="106" font-family="sans-serif" font-size="46" font-weight="700" fill="#E4E7EC">recognitio 1.3.0</text>
  <text x="196" y="140" font-family="sans-serif" font-size="19" fill="#B0B6C0">Pulls the relevant changes from a pull request or a commit range, with the</text>
  <text x="196" y="166" font-family="sans-serif" font-size="19" fill="#B0B6C0">context a reviewer needs, into one verified review packet.</text>
  <text x="1136" y="76" text-anchor="end" font-family="sans-serif" font-size="16" font-weight="700" fill="#79C0FF">FIRST TAGGED RELEASE</text>

  <rect x="64" y="204" width="504" height="252" rx="14" fill="#181B23" stroke="#343842" stroke-width="2"/>
  <text x="96" y="246" font-family="sans-serif" font-size="22" font-weight="700" fill="#E4E7EC">Paired eval results</text>
  <text x="96" y="290" font-family="sans-serif" font-size="16" font-weight="600" fill="#E4E7EC">Packet pass</text>
  <text x="536" y="290" text-anchor="end" font-family="sans-serif" font-size="16" font-weight="700" fill="#E4E7EC">8 of 8</text>
  <rect x="96" y="300" width="440" height="26" rx="6" fill="#262B36"/>
  <rect x="96" y="300" width="440" height="26" rx="6" fill="#D97757"/>
  <text x="96" y="356" font-family="sans-serif" font-size="16" font-weight="600" fill="#E4E7EC">Raw diff pass</text>
  <text x="536" y="356" text-anchor="end" font-family="sans-serif" font-size="16" font-weight="700" fill="#E4E7EC">4 of 8</text>
  <rect x="96" y="366" width="440" height="26" rx="6" fill="#262B36"/>
  <rect x="96" y="366" width="220" height="26" rx="6" fill="#79C0FF"/>
  <text x="96" y="428" font-family="sans-serif" font-size="14" fill="#B0B6C0">On defects inside the diff the two passes tied at 4 of 4 each.</text>

  <rect x="632" y="204" width="504" height="252" rx="14" fill="#181B23" stroke="#343842" stroke-width="2"/>
  <text x="664" y="246" font-family="sans-serif" font-size="22" font-weight="700" fill="#E4E7EC">One recorded run in full</text>
  <text x="664" y="312" font-family="sans-serif" font-size="42" font-weight="700" fill="#E4E7EC">28 files</text>
  <text x="664" y="358" font-family="sans-serif" font-size="42" font-weight="700" fill="#E4E7EC">3,233 lines of diff</text>
  <circle cx="676" cy="414" r="9" fill="none" stroke="#4AC76A" stroke-width="3"/>
  <polyline points="671,414 675,418 682,409" fill="none" stroke="#4AC76A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="696" y="420" font-family="sans-serif" font-size="15" fill="#B0B6C0">The packet check passes in the recorded session.</text>

  <line x1="64" y1="492" x2="1136" y2="492" stroke="#343842" stroke-width="1"/>
  <text x="600" y="536" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="600" fill="#E4E7EC">Verified proves the packet is complete. It does not prove the change is correct or safe.</text>
  <text x="600" y="574" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#B0B6C0">Sources. The paired eval results in evals/RESULTS.md and the capture record in docs/images in this repo.</text>
</svg>
