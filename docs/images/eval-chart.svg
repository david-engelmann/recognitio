<svg xmlns="http://www.w3.org/2000/svg" width="720" height="408" viewBox="0 0 720 408" role="img" aria-labelledby="chartTitle chartDesc">
  <title id="chartTitle">Paired eval results. The packet pass found 8 of 8 planted defects and the raw diff pass found 4 of 8.</title>
  <desc id="chartDesc">Two bars on a scale of eight. On the defects inside the diff the two passes tied at 4 of 4 each. In unchanged files the packet pass found 4 of 4 and the raw diff pass found 0 of 4.</desc>
  <rect x="1" y="1" width="718" height="406" rx="14" fill="#181B23" stroke="#343842" stroke-width="2"/>
  <text x="36" y="50" font-family="sans-serif" font-size="23" font-weight="700" fill="#E4E7EC">Paired eval results</text>
  <text x="36" y="76" font-family="sans-serif" font-size="14" fill="#B0B6C0">Planted defects found across four fixture tasks</text>

  <text x="36" y="118" font-family="sans-serif" font-size="16" font-weight="600" fill="#E4E7EC">Packet pass</text>
  <text x="684" y="118" text-anchor="end" font-family="sans-serif" font-size="16" font-weight="700" fill="#E4E7EC">8 of 8</text>
  <rect x="36" y="128" width="648" height="32" rx="6" fill="#262B36"/>
  <rect x="36" y="128" width="648" height="32" rx="6" fill="#D97757"/>

  <text x="36" y="192" font-family="sans-serif" font-size="16" font-weight="600" fill="#E4E7EC">Raw diff pass</text>
  <text x="684" y="192" text-anchor="end" font-family="sans-serif" font-size="16" font-weight="700" fill="#E4E7EC">4 of 8</text>
  <rect x="36" y="202" width="648" height="32" rx="6" fill="#262B36"/>
  <rect x="36" y="202" width="324" height="32" rx="6" fill="#79C0FF"/>

  <g font-family="sans-serif" font-size="12" fill="#B0B6C0" text-anchor="middle">
    <text x="36" y="254" text-anchor="start">0</text>
    <text x="198" y="254">2</text>
    <text x="360" y="254">4</text>
    <text x="522" y="254">6</text>
    <text x="684" y="254" text-anchor="end">8</text>
  </g>
  <g stroke="#343842" stroke-width="1">
    <line x1="36" y1="240" x2="36" y2="246"/>
    <line x1="198" y1="240" x2="198" y2="246"/>
    <line x1="360" y1="240" x2="360" y2="246"/>
    <line x1="522" y1="240" x2="522" y2="246"/>
    <line x1="684" y1="240" x2="684" y2="246"/>
  </g>

  <line x1="36" y1="272" x2="684" y2="272" stroke="#343842" stroke-width="1"/>

  <text x="36" y="302" font-family="sans-serif" font-size="14" fill="#E4E7EC">On defects inside the diff the passes tied at 4 of 4 each.</text>
  <text x="36" y="326" font-family="sans-serif" font-size="14" fill="#E4E7EC">In unchanged files the packet found 4 of 4 and the raw pass found 0 of 4.</text>
  <text x="36" y="350" font-family="sans-serif" font-size="14" fill="#B0B6C0">Every defect the raw pass missed lived in a file the diff never showed.</text>

  <text x="36" y="386" font-family="sans-serif" font-size="12" fill="#B0B6C0">Source. The paired eval results recorded in evals/RESULTS.md in this repo.</text>
</svg>
