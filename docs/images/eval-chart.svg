<svg xmlns="http://www.w3.org/2000/svg" width="720" height="492" viewBox="0 0 720 492" role="img" aria-labelledby="chartTitle chartDesc">
  <title id="chartTitle">Paired eval results. The packet pass found 8 of 8 planted defects and the raw diff pass found 4 of 8.</title>
  <desc id="chartDesc">Two bars on a scale of eight. On the defects inside the diff the two passes tied at 4 of 4 each. In unchanged files the packet pass found 4 of 4 and the raw diff pass found 0 of 4.</desc>
  <rect x="1" y="1" width="718" height="490" rx="14" fill="#181B23" stroke="#343842" stroke-width="2"/>
  <text x="36" y="52" font-family="sans-serif" font-size="23" font-weight="700" fill="#E4E7EC">Paired eval results</text>
  <text x="36" y="86" font-family="sans-serif" font-size="18" fill="#B0B6C0">Planted defects found across four fixture tasks</text>

  <text x="36" y="128" font-family="sans-serif" font-size="18" font-weight="600" fill="#E4E7EC">Packet pass</text>
  <text x="684" y="128" text-anchor="end" font-family="sans-serif" font-size="18" font-weight="700" fill="#E4E7EC">8 of 8</text>
  <rect x="36" y="140" width="648" height="34" rx="6" fill="#262B36"/>
  <rect x="36" y="140" width="648" height="34" rx="6" fill="#D97757"/>

  <text x="36" y="208" font-family="sans-serif" font-size="18" font-weight="600" fill="#E4E7EC">Raw diff pass</text>
  <text x="684" y="208" text-anchor="end" font-family="sans-serif" font-size="18" font-weight="700" fill="#E4E7EC">4 of 8</text>
  <rect x="36" y="220" width="648" height="34" rx="6" fill="#262B36"/>
  <rect x="36" y="220" width="324" height="34" rx="6" fill="#79C0FF"/>

  <g font-family="sans-serif" font-size="18" fill="#B0B6C0" text-anchor="middle">
    <text x="36" y="282" text-anchor="start">0</text>
    <text x="198" y="282">2</text>
    <text x="360" y="282">4</text>
    <text x="522" y="282">6</text>
    <text x="684" y="282" text-anchor="end">8</text>
  </g>
  <g stroke="#343842" stroke-width="1">
    <line x1="36" y1="258" x2="36" y2="264"/>
    <line x1="198" y1="258" x2="198" y2="264"/>
    <line x1="360" y1="258" x2="360" y2="264"/>
    <line x1="522" y1="258" x2="522" y2="264"/>
    <line x1="684" y1="258" x2="684" y2="264"/>
  </g>

  <line x1="36" y1="300" x2="684" y2="300" stroke="#343842" stroke-width="1"/>

  <text x="36" y="334" font-family="sans-serif" font-size="18" fill="#E4E7EC">On defects inside the diff the passes tied at 4 of 4 each.</text>
  <text x="36" y="364" font-family="sans-serif" font-size="18" fill="#E4E7EC">In unchanged files the packet found 4 of 4 and the raw pass found 0 of 4.</text>
  <text x="36" y="394" font-family="sans-serif" font-size="18" fill="#B0B6C0">Every defect the raw pass missed lived in a file the diff never showed.</text>

  <text x="36" y="440" font-family="sans-serif" font-size="18" fill="#B0B6C0">Source. The paired eval results recorded in evals/RESULTS.md</text>
  <text x="36" y="468" font-family="sans-serif" font-size="18" fill="#B0B6C0">in this repo.</text>
</svg>
